<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Bereich · HUDPilot</title><link rel="icon" href="/logo.png" type="image/png">
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#14181f;--mu:#667085;--ac:#ff8a00;--ac2:#ffa043;--bd:#e3e6ec;--hot:#fff3e3;--m1:#e6eddc;--m2:#d6e2c8;--er:#c62828}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f2f4f8;--mu:#9aa3b2;--bd:#2a2f3a;--hot:#2a1c10;--m1:#222a24;--m2:#1b221d;--er:#ff6b6b}}:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f2f4f8;--mu:#9aa3b2;--bd:#2a2f3a;--hot:#2a1c10;--m1:#222a24;--m2:#1b221d;--er:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,system-ui,"Segoe UI",sans-serif}
main{max-width:1360px;margin:0 auto;padding:26px 28px 56px}.mu{color:var(--mu)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.top h1{margin:0;font-size:clamp(26px,4vw,34px);letter-spacing:-.02em}
.pill{background:var(--ac);color:#fff;font-weight:700;font-size:14px;padding:4px 13px;border-radius:99px}
.lab{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:26px 0 12px}.top+.lab{margin-top:0}
.c{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px 22px;position:relative}.hot{background:var(--hot);border-color:var(--ac)}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.k span{display:block;color:var(--mu);font-size:15px}.k b{display:block;font-size:26px;letter-spacing:-.02em;margin:2px 0;white-space:nowrap}.k small{color:var(--mu);font-size:14px}
.d{position:absolute;right:20px;top:20px;width:11px;height:11px;border-radius:50%;background:#2ecc71}.d.o{background:#ffa000}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.ph b{font-size:18px}
.seg{display:flex;gap:6px;align-items:center}.seg span{padding:5px 13px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);font-size:14px;cursor:pointer}.seg .on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
select{padding:5px 10px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--tx);font-size:14px}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;margin-top:10px}.bars div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:13px;color:var(--mu);gap:6px}
.bars i{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:var(--bd);display:block}.bars .on{color:var(--tx);font-weight:700}.bars .on i{background:var(--ac)}.bars .hv i{background:var(--ac)}
.pl{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd);text-decoration:none;color:inherit}.pl:first-child{padding-top:2px}.pl:last-child{border:0;padding-bottom:2px}
.ic{width:44px;height:44px;border-radius:50%;background:var(--hot);display:grid;place-items:center;flex:none}.ic svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl div:nth-child(2){flex:1;min-width:0}.pl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl small{color:var(--mu)}.pl:hover b{color:var(--ac)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.f{padding:0;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s}.f:hover{transform:translateY(-2px);border-color:var(--ac)}
.f .wp{height:104px;background:linear-gradient(135deg,var(--m1),var(--m2))}.f .wp svg{width:100%;height:104px;display:block;border-radius:0!important}
.ft{padding:13px 16px}.ft b{display:block;font-size:15px}.ft span{color:var(--mu);font-size:13px;display:block}.ft em{font-style:normal;font-weight:800;font-size:18px;display:block;margin-top:2px}
@media(max-width:1180px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.two{grid-template-columns:1fr}}
@media(max-width:640px){main{padding:18px 16px 40px}.c{padding:14px 16px}.k b{font-size:22px}.g5 .f:nth-child(5){display:none}.g6{grid-template-columns:repeat(2,1fr)}.g5{grid-template-columns:repeat(2,1fr)}.bars{gap:5px}}
#lg{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px;width:min(380px,100%);box-shadow:0 10px 40px rgba(0,0,0,.15)}
.box .top{text-align:center;margin-bottom:14px}.box img{width:78px;height:78px;border-radius:19px}.box h1{font-size:22px;margin:8px 0 0}
.tabs{display:flex;background:var(--bg);border-radius:11px;padding:3px;margin:14px 0}.tabs span{flex:1;text-align:center;padding:8px;border-radius:9px;color:var(--mu);font-weight:600;cursor:pointer}.tabs .on{background:var(--ac);color:#fff}
input{width:100%;padding:12px;margin-bottom:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.btn{width:100%;margin-top:4px;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#m{color:var(--er);min-height:22px;margin-top:8px;font-size:14px;text-align:center}.box a{color:var(--mu);font-size:14px}
.pww{position:relative}.pww input{padding-right:48px}.pww button{position:absolute;right:4px;top:3px;width:42px;height:40px;border:0;background:none;font-size:20px;cursor:pointer;opacity:.6;color:var(--tx)}.pww button.on{opacity:1}
.code{font-size:30px;letter-spacing:4px;text-align:center;margin:12px 0;font-weight:700}
</style></head><body><!--NAV-->
<div id="lg"><div class="box"><div class="top"><img src="/logo.png" alt=""><h1>Mein Bereich</h1><div class="mu">Planer und Touren</div></div>
<div id="fm"><div class="tabs"><span id="t1" class="on">Anmelden</span><span id="t2">Neu anlegen</span></div>
<input id="n" placeholder="Name" autocomplete="username"><div class="pww"><input id="c" type="password" placeholder="Passwort" autocomplete="current-password"><button type="button" id="eye" title="Passwort anzeigen" aria-label="Passwort anzeigen">&#128065;</button></div>
<button class="btn" id="go">Anmelden</button><div id="m"></div><div style="text-align:center"><a href="/">← zur Startseite</a></div></div></div></div>
<main id="mn" style="display:none"><div class="top"><h1 id="hi">Hallo</h1><span class="pill" id="hp" style="display:none">heute gefahren</span></div>
<div class="lab">Dein Jahr</div>
<div class="g6"><div class="c k"><span>Gefahrene Touren</span><b id="k1">–</b><small id="s1">&nbsp;</small></div><div class="c k"><span id="l2">Kilometer</span><b id="k2">–</b><small id="s2">&nbsp;</small></div><div class="c k"><span>Längste Fahrt</span><b id="k3">–</b><small id="s3">&nbsp;</small></div><div class="c k"><span>Höchstgeschwindigkeit</span><b id="k4">–</b><small id="s4">&nbsp;</small></div><div class="c k"><span>Geplante Touren</span><b id="k5">–</b><small id="s5">&nbsp;</small></div><div class="c k"><span>Letzte Fahrt</span><b id="k6">–</b><small id="s6">&nbsp;</small></div></div>
<div class="two"><div><div class="lab">Kilometer</div><div class="c"><div class="ph"><b id="cht">Pro Monat</b><div class="seg"><select id="yr"></select><span id="g1" class="on">Monat</span><span id="g2">Jahr</span></div></div><div id="ch"></div></div></div>
<div><div class="lab">Zuletzt geplant</div><div class="c" id="to"><div class="mu">…</div></div></div></div>
<div class="lab">Zuletzt gefahren</div><div id="ri" class="g5"><div class="mu">…</div></div>
</main>
<script>
const $=i=>document.getElementById(i);const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dt=t=>new Date(t).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
function ck(n,c){document.cookie="hudprof="+encodeURIComponent(n+"|"+c)+"; path=/; max-age=31536000; SameSite=Strict"}
let neu=false;function pwtype(){const c=$("c"),e=$("eye");const show=neu||e.classList.contains("on");c.type=show?"text":"password";c.autocomplete=neu?"off":"current-password";e.style.display=neu?"none":"";e.title=e.getAttribute("aria-label")=="Passwort anzeigen"?"Passwort anzeigen":"Passwort verbergen"}
function tab(x){neu=x;$("t1").className=x?"":"on";$("t2").className=x?"on":"";$("go").textContent=x?"Neu anlegen":"Anmelden";$("c").placeholder=x?"Einladungscode":"Passwort";$("m").textContent="";pwtype()}
$("t1").onclick=()=>tab(false);$("t2").onclick=()=>tab(true);
function showLogin(){document.documentElement.className="nonav";$("lg").style.display="flex"}
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];let R=[],mode="m";
const fk=m=>(m/1000).toLocaleString("de-DE",{maximumFractionDigits:0})+" km";
function prevSvg(p,w,h){const D=window.hpDark?hpDark():(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),pd=18,L2=Math.LN2;
 const mx=lo=>(lo+180)/360*256,my=la=>{const s=Math.sin(la*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256};
 const X=p.map(q=>mx(q[1])),Y=p.map(q=>my(q[0]));const x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y);
 const zf=Math.max(0,Math.min(17,Math.log(Math.min((w-2*pd)/Math.max(x1-x0,1e-7),(h-2*pd)/Math.max(y1-y0,1e-7)))/L2));
 const sc=Math.pow(2,zf),cx=(x0+x1)/2*sc,cy=(y0+y1)/2*sc,z=Math.min(Math.floor(zf),16),ts=256*Math.pow(2,zf-z),n=Math.pow(2,z);
 const ox=cx-w/2,oy=cy-h/2;let img="";
 for(let tx=Math.floor(ox/ts);tx<=Math.floor((ox+w)/ts);tx++)for(let ty=Math.floor(oy/ts);ty<=Math.floor((oy+h)/ts);ty++){if(ty<0||ty>=n)continue;const u=((tx%n)+n)%n;
  const url=D?"https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/"+z+"/"+ty+"/"+u:"https://tile.openstreetmap.org/"+z+"/"+u+"/"+ty+".png";
  img+='<image href="'+url+'" x="'+(tx*ts-ox).toFixed(1)+'" y="'+(ty*ts-oy).toFixed(1)+'" width="'+(ts+.6).toFixed(1)+'" height="'+(ts+.6).toFixed(1)+'"/>'}
 const pt=p.map((q,i)=>(X[i]*sc-ox).toFixed(1)+","+(Y[i]*sc-oy).toFixed(1)),b=pt[0].split(","),e=pt[pt.length-1].split(",");
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="xMidYMid slice" style="display:block;border-radius:10px;height:'+h+'px">'+img+'<polyline points="'+pt.join(" ")+'" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><polyline points="'+pt.join(" ")+'" fill="none" stroke="#ff7a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r="5" fill="#1a8f3c" stroke="#fff" stroke-width="1.5"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="5" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text x="'+(w-3)+'" y="'+(h-3)+'" text-anchor="end" font-size="7" fill="'+(D?"#ccc":"#444")+'">© OpenStreetMap'+(D?" · Esri":"")+'</text></svg>'}
const IC='<span class="ic"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>';
const dsh=t=>new Date(t).toLocaleDateString("de-DE",{day:"numeric",month:"long"}),tm=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const dd=t=>{const a=new Date(t),n=new Date(),k=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);return k==0?"heute":k==1?"gestern":dsh(t)};
const dur=ms=>{const m=Math.max(1,Math.round(ms/60000));return m>=60?Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min":m+" min"};
function chart(){const y=+$("yr").value,nw=new Date();let L=[],V=[],cur=-1;
 if(mode=="m"){L=MON;V=MON.map(()=>0);R.forEach(r=>{const d=new Date(r.stats.start);if(d.getFullYear()==y)V[d.getMonth()]+=r.stats.dist_m/1000});if(y==nw.getFullYear())cur=nw.getMonth()}
 else{const ys={};R.forEach(r=>{const k=new Date(r.stats.start).getFullYear();ys[k]=(ys[k]||0)+r.stats.dist_m/1000});L=Object.keys(ys).sort();V=L.map(k=>ys[k]);cur=L.indexOf(String(nw.getFullYear()))}
 $("cht").textContent=mode=="m"?"Pro Monat":"Pro Jahr";
 if(!L.length){$("ch").innerHTML='<div class="mu" style="padding:16px 0">Noch keine Fahrten.</div>';return}
 const mx=Math.max(...V,1);
 $("ch").innerHTML='<div class="bars">'+L.map((l,i)=>'<div'+(i==cur?' class="on"':'')+'>'+(V[i]>0?Math.round(V[i]):"")+'<i style="height:'+(V[i]>0?Math.max(5,Math.round(V[i]/mx*84)):3)+'%"></i>'+l+'</div>').join("")+'</div>'}
async function dash(j){$("lg").style.display="none";$("mn").style.display="block";$("hi").textContent="Hallo "+j.name;$("k5").textContent=j.touren;
 try{const all=(await(await fetch("/api/rides")).json()).fahrten||[];R=all.filter(x=>!x.demo&&!/^Beispiel:/.test(x.name)).sort((a,b)=>b.stats.start-a.stats.start);const yr=new Date().getFullYear();
  const tot=R.reduce((s,x)=>s+x.stats.dist_m,0),thisY=R.filter(x=>new Date(x.stats.start).getFullYear()==yr).reduce((s,x)=>s+x.stats.dist_m,0);
  $("k1").textContent=R.length;$("s1").textContent=R.length?"seit "+new Date(R[R.length-1].stats.start).toLocaleDateString("de-DE",{month:"long",year:"numeric"}):"noch keine Fahrt";
  $("l2").textContent="Kilometer "+yr;$("k2").textContent=fk(thisY);$("s2").textContent="gesamt "+fk(tot);
  if(R.length){const lo=R.reduce((a,b)=>b.stats.dist_m>a.stats.dist_m?b:a),hi=R.reduce((a,b)=>b.stats.max_kmh>a.stats.max_kmh?b:a),la=R[0];
   $("k3").textContent=fk(lo.stats.dist_m);$("s3").textContent="am "+dsh(lo.stats.start);$("k4").textContent=hi.stats.max_kmh+" km/h";$("s4").textContent="am "+dsh(hi.stats.start);
   $("k6").textContent=dd(la.stats.start);$("s6").textContent=tm(la.stats.start)+" · "+Math.round(la.stats.dist_m/1000)+" km";if(dd(la.stats.start)=="heute")$("hp").style.display=""}
  else{$("k3").textContent="–";$("k4").textContent="–";$("k6").textContent="–"}
  const years=[...new Set(R.map(x=>new Date(x.stats.start).getFullYear()).concat([yr]))].sort((a,b)=>b-a);$("yr").innerHTML=years.map(v=>"<option>"+v+"</option>").join("");
  $("yr").onchange=chart;$("g1").onclick=()=>{mode="m";$("g1").className="on";$("g2").className="";$("yr").style.display="";chart()};$("g2").onclick=()=>{mode="y";$("g2").className="on";$("g1").className="";$("yr").style.display="none";chart()};chart();
  const rec=R.slice(0,5);$("ri").innerHTML=rec.length?rec.map((x,i)=>'<a class="c f'+(i==0?" hot":"")+'" href="/touren?ride='+x.id+'"><div class="wp" id="wp'+x.id+'"></div><div class="ft"><b>'+esc(dt(x.stats.start))+" "+tm(x.stats.start)+'</b><span>'+dur(x.stats.total_ms)+' · max '+x.stats.max_kmh+' km/h</span><em>'+Math.round(x.stats.dist_m/1000)+' km</em></div></a>').join(""):'<div class="mu">Noch keine Fahrt hochgeladen.</div>';
  rec.forEach(x=>fetch("/api/ride/preview?id="+x.id).then(r=>r.json()).then(p=>{const el=$("wp"+x.id);if(el&&p.p&&p.p.length>1)el.innerHTML=prevSvg(p.p,300,104)}).catch(()=>{}))}catch(e){}
 try{const t=(await(await fetch("/api/tours")).json()).touren||[];
  $("to").innerHTML=t.length?t.slice(0,5).map(x=>'<a class="pl" href="/planer?tour='+x.id+'">'+IC+'<div><b>'+esc(x.name)+'</b><small>'+(x.km!=null?Math.round(x.km)+" km | "+Math.floor(x.min/60)+" h "+String(x.min%60).padStart(2,"0")+" min":(x.updated?dd(x.updated*1000):""))+'</small></div></a>').join(""):'<div class="mu">Noch keine Tour geplant.</div>';
  if(t.length&&t[0].updated)$("s5").textContent="zuletzt "+dd(t[0].updated*1000);else $("s5").textContent=t.length?"":"noch keine"}catch(e){}}
async function me(){try{const r=await fetch("/api/me");return r.ok?await r.json():null}catch(e){return null}}
me().then(j=>j?dash(j):showLogin());
$("eye").onclick=()=>{const e=$("eye");e.classList.toggle("on");e.setAttribute("aria-label",e.classList.contains("on")?"Passwort verbergen":"Passwort anzeigen");pwtype()};
$("go").onclick=async()=>{const n=$("n").value.trim(),c=$("c").value.trim();if(!n||!c){$("m").textContent=neu?"Name und Einladungscode eintragen.":"Name und Passwort eintragen.";return}
 if(!neu){ck(n,c);if(await me()){location.reload()}else{$("m").textContent="Name oder Passwort stimmt nicht.";document.cookie="hudprof=; path=/; max-age=0"}return}
 const r=await fetch("/api/profile/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,invite:c})});const j=await r.json().catch(()=>({}));
 if(!r.ok){$("m").textContent=j.fehler||"Fehler";return}ck(j.name,j.code);
 $("fm").innerHTML='<h1 style="font-size:20px;text-align:center">Profil angelegt</h1><p class="mu" style="text-align:center">Dein persönliches Passwort. Bitte merken, damit meldest du dich am Handy und an anderen Geräten an:</p><div class="code">'+esc(j.code)+'</div><button class="btn" id="ok">Weiter</button>';$("ok").onclick=()=>location.reload()};
</script></body></html>
