<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Bereich · HUDPilot</title><link rel="icon" href="/logo.png" type="image/png">
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#ff7a00;--ac2:#ff9a2e;--bd:#dde1e6;--er:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#1a1e26;--tx:#e8eaed;--mu:#9aa;--bd:#2b313b;--er:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 40px}h1{font-size:26px;margin:6px 0 2px}.mu{color:var(--mu)}
h3{margin:26px 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.s{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}.s b{display:block;font-size:26px;line-height:1.15}.s span{color:var(--mu);font-size:13px}
.list{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 16px}.r{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);text-decoration:none;color:inherit}.r:last-child{border:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.c{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:transform .15s,border-color .15s}.c:hover{transform:translateY(-2px);border-color:var(--ac)}
.ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac2),var(--ac));display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.c h2{margin:0;font-size:18px}.c p{margin:2px 0 0;color:var(--mu);font-size:14px}
.hero{background:linear-gradient(135deg,#ff9a2e,#ff7a00 55%,#e65100);color:#fff;border-radius:22px;padding:26px 24px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(255,122,0,.28)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(255,255,255,.25);box-shadow:0 0 0 40px rgba(255,255,255,.07),0 0 0 80px rgba(255,255,255,.04)}
.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(24px,5vw,32px);margin:0}.hero p{margin:4px 0 16px;opacity:.92}.hero .hb{display:flex;gap:10px;flex-wrap:wrap}
.hero a{background:#fff;color:#e65100;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:12px}.hero a.g{background:rgba(255,255,255,.2);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 0}.kp div{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:12px 14px}.kp b{display:block;font-size:24px;line-height:1.2}.kp span{color:var(--mu);font-size:13px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:12px}.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}.seg span{padding:5px 12px;border-radius:8px;color:var(--mu);font-weight:600;font-size:13px;cursor:pointer}.seg .on{background:var(--ac);color:#fff}
select{padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:13px}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.wc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s}.wc:hover{transform:translateY(-2px);border-color:var(--ac)}
.wc .wp{height:100px;border-radius:10px;background:linear-gradient(135deg,rgba(255,122,0,.12),rgba(255,122,0,.03));margin-bottom:6px}.wc span{color:var(--mu);font-size:13px}.wc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars text{fill:var(--mu);font-size:11px}
#lg{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px;width:min(380px,100%);box-shadow:0 10px 40px rgba(0,0,0,.15)}
.box .top{text-align:center;margin-bottom:14px}.box img{width:78px;height:78px;border-radius:19px}.box h1{font-size:22px;margin:8px 0 0}
.tabs{display:flex;background:var(--bg);border-radius:11px;padding:3px;margin:14px 0}.tabs span{flex:1;text-align:center;padding:8px;border-radius:9px;color:var(--mu);font-weight:600;cursor:pointer}.tabs .on{background:var(--ac);color:#fff}
input{width:100%;padding:12px;margin-bottom:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.btn{width:100%;margin-top:4px;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#m{color:var(--er);min-height:22px;margin-top:8px;font-size:14px;text-align:center}.box a{color:var(--mu);font-size:14px}
.code{font-size:30px;letter-spacing:4px;text-align:center;margin:12px 0;font-weight:700}
</style></head><body><!--NAV-->
<div id="lg"><div class="box"><div class="top"><img src="/logo.png" alt=""><h1>Mein Bereich</h1><div class="mu">Planer und Touren</div></div>
<div id="fm"><div class="tabs"><span id="t1" class="on">Anmelden</span><span id="t2">Neu anlegen</span></div>
<input id="n" placeholder="Name" autocomplete="username"><input id="c" placeholder="Code" autocomplete="off" style="text-transform:uppercase">
<button class="btn" id="go">Anmelden</button><div id="m"></div><div style="text-align:center"><a href="/">← zur Startseite</a></div></div></div></div>
<main id="mn" style="display:none"><div class="hero"><h1 id="hi">Hallo</h1><div class="hb"><a href="/planer">Neue Tour planen</a><a class="g" href="/touren">Alle Touren</a></div></div>
<div class="kp"><div><b id="k1">–</b><span>Gefahrene Touren</span></div><div><b id="k2">–</b><span>Kilometer gesamt</span></div><div><b id="k3">–</b><span id="k3l">Kilometer dieses Jahr</span></div><div><b id="k4">–</b><span>Längste Fahrt</span></div><div><b id="k5">–</b><span>Höchstgeschwindigkeit</span></div><div><b id="k6">–</b><span>Geplante Touren</span></div></div>
<div class="panel"><div class="ph"><h3 style="margin:0">Kilometer</h3><div style="display:flex;gap:8px;align-items:center"><select id="yr"></select><div class="seg"><span id="g1" class="on">Monat</span><span id="g2">Jahr</span></div></div></div><div id="ch"></div></div>
<h3>Zuletzt gefahren</h3><div id="ri" class="wg"><div class="mu">…</div></div>
<h3>Zuletzt geplant</h3><div class="list" id="to"><div class="mu" style="padding:12px 0">…</div></div></main>
<script>
const $=i=>document.getElementById(i);const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dt=t=>new Date(t).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
function ck(n,c){document.cookie="hudprof="+encodeURIComponent(n+"|"+c)+"; path=/; max-age=31536000; SameSite=Strict"}
let neu=false;function tab(x){neu=x;$("t1").className=x?"":"on";$("t2").className=x?"on":"";$("go").textContent=x?"Neu anlegen":"Anmelden";$("c").placeholder=x?"Einladungscode":"Code";$("m").textContent=""}
$("t1").onclick=()=>tab(false);$("t2").onclick=()=>tab(true);
function showLogin(){document.documentElement.className="nonav";$("lg").style.display="flex"}
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];let R=[],mode="m";
const fk=m=>(m/1000).toLocaleString("de-DE",{maximumFractionDigits:0})+" km";
function prevSvg(p,w,h){const D=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches,pd=18,L2=Math.LN2;
 const mx=lo=>(lo+180)/360*256,my=la=>{const s=Math.sin(la*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256};
 const X=p.map(q=>mx(q[1])),Y=p.map(q=>my(q[0]));const x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y);
 const zf=Math.max(0,Math.min(17,Math.log(Math.min((w-2*pd)/Math.max(x1-x0,1e-7),(h-2*pd)/Math.max(y1-y0,1e-7)))/L2));
 const sc=Math.pow(2,zf),cx=(x0+x1)/2*sc,cy=(y0+y1)/2*sc,z=Math.min(Math.floor(zf),16),ts=256*Math.pow(2,zf-z),n=Math.pow(2,z);
 const ox=cx-w/2,oy=cy-h/2;let img="";
 for(let tx=Math.floor(ox/ts);tx<=Math.floor((ox+w)/ts);tx++)for(let ty=Math.floor(oy/ts);ty<=Math.floor((oy+h)/ts);ty++){if(ty<0||ty>=n)continue;const u=((tx%n)+n)%n;
  const url=D?"https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/"+z+"/"+ty+"/"+u:"https://tile.openstreetmap.org/"+z+"/"+u+"/"+ty+".png";
  img+='<image href="'+url+'" x="'+(tx*ts-ox).toFixed(1)+'" y="'+(ty*ts-oy).toFixed(1)+'" width="'+(ts+.6).toFixed(1)+'" height="'+(ts+.6).toFixed(1)+'"/>'}
 const pt=p.map((q,i)=>(X[i]*sc-ox).toFixed(1)+","+(Y[i]*sc-oy).toFixed(1)),b=pt[0].split(","),e=pt[pt.length-1].split(",");
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="xMidYMid slice" style="display:block;border-radius:10px;height:'+h+'px">'+img+'<polyline points="'+pt.join(" ")+'" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><polyline points="'+pt.join(" ")+'" fill="none" stroke="#ff7a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r="5" fill="#1a8f3c" stroke="#fff" stroke-width="1.5"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="5" fill="#c62828" stroke="#fff" stroke-width="1.5"/><text x="'+(w-3)+'" y="'+(h-3)+'" text-anchor="end" font-size="7" fill="'+(D?"#ccc":"#444")+'">© OpenStreetMap'+(D?" · Esri":"")+'</text></svg>'}
function chart(){const y=+$("yr").value;let L=[],V=[];
 if(mode=="m"){L=MON;V=MON.map(()=>0);R.forEach(r=>{const d=new Date(r.stats.start);if(d.getFullYear()==y)V[d.getMonth()]+=r.stats.dist_m/1000})}
 else{const ys={};R.forEach(r=>{const k=new Date(r.stats.start).getFullYear();ys[k]=(ys[k]||0)+r.stats.dist_m/1000});L=Object.keys(ys).sort();V=L.map(k=>ys[k])}
 if(!L.length){$("ch").innerHTML='<div class="mu" style="padding:16px 0">Noch keine Fahrten.</div>';return}
 const W=640,H=200,mx=Math.max(...V,1),bw=W/L.length;
 $("ch").innerHTML='<svg class="bars" viewBox="0 0 '+W+' '+(H+26)+'" width="100%">'+L.map((l,i)=>{const h=Math.round(V[i]/mx*(H-24));const x=i*bw+bw*.18;
  return '<rect x="'+x+'" y="'+(H-h)+'" width="'+bw*.64+'" height="'+Math.max(h,V[i]>0?3:0)+'" rx="6" fill="#ff7a00" opacity="'+(V[i]>0?1:.15)+'"/>'+(V[i]>0?'<text x="'+(x+bw*.32)+'" y="'+(H-h-5)+'" text-anchor="middle">'+Math.round(V[i])+'</text>':'')+'<text x="'+(x+bw*.32)+'" y="'+(H+16)+'" text-anchor="middle">'+l+'</text>'}).join("")+'</svg>'}
async function dash(j){$("lg").style.display="none";$("mn").style.display="block";$("hi").textContent="Hallo "+j.name+" 👋";$("k6").textContent=j.touren;
 try{const all=(await(await fetch("/api/rides")).json()).fahrten||[];R=all.filter(x=>!x.demo&&!/^Beispiel:/.test(x.name));const yr=new Date().getFullYear();
  const tot=R.reduce((s,x)=>s+x.stats.dist_m,0),thisY=R.filter(x=>new Date(x.stats.start).getFullYear()==yr).reduce((s,x)=>s+x.stats.dist_m,0);
  $("k1").textContent=R.length;$("k2").textContent=fk(tot);$("k3").textContent=fk(thisY);$("k3l").textContent="Kilometer "+yr;
  $("k4").textContent=R.length?fk(Math.max(...R.map(x=>x.stats.dist_m))):"–";$("k5").textContent=R.length?Math.max(...R.map(x=>x.stats.max_kmh))+" km/h":"–";
  const years=[...new Set(R.map(x=>new Date(x.stats.start).getFullYear()).concat([yr]))].sort((a,b)=>b-a);$("yr").innerHTML=years.map(v=>"<option>"+v+"</option>").join("");
  $("yr").onchange=chart;$("g1").onclick=()=>{mode="m";$("g1").className="on";$("g2").className="";$("yr").style.display="";chart()};$("g2").onclick=()=>{mode="y";$("g2").className="on";$("g1").className="";$("yr").style.display="none";chart()};chart();
  const rec=R.slice(0,6);$("ri").innerHTML=rec.length?rec.map(x=>'<a class="wc" href="/touren?ride='+x.id+'"><div class="wp" id="wp'+x.id+'"></div><b>'+esc(x.name)+'</b><span>'+esc(dt(x.stats.start))+'</span><span><strong>'+Math.round(x.stats.dist_m/1000)+' km</strong> · '+Math.floor(x.stats.total_ms/3600000)+' h '+String(Math.round(x.stats.total_ms/60000)%60).padStart(2,"0")+' min · max '+x.stats.max_kmh+' km/h</span></a>').join(""):'<div class="mu">Noch keine Fahrt hochgeladen.</div>';
  rec.forEach(x=>fetch("/api/ride/preview?id="+x.id).then(r=>r.json()).then(p=>{const el=$("wp"+x.id);if(el&&p.p&&p.p.length>1)el.innerHTML=prevSvg(p.p,260,100)}).catch(()=>{}))}catch(e){}
 try{const t=(await(await fetch("/api/tours")).json()).touren||[];
  $("to").innerHTML=t.length?t.slice(0,5).map(x=>'<a class="r" href="/planer?tour='+x.id+'"><span>'+esc(x.name)+'</span><span class="mu">'+x.points+' Punkte</span></a>').join(""):'<div class="mu" style="padding:12px 0">Noch keine Tour geplant.</div>'}catch(e){}}
async function me(){try{const r=await fetch("/api/me");return r.ok?await r.json():null}catch(e){return null}}
me().then(j=>j?dash(j):showLogin());
$("go").onclick=async()=>{const n=$("n").value.trim(),c=$("c").value.trim();if(!n||!c){$("m").textContent=neu?"Name und Einladungscode eintragen.":"Name und Code eintragen.";return}
 if(!neu){ck(n,c);if(await me()){location.reload()}else{$("m").textContent="Name oder Code stimmt nicht.";document.cookie="hudprof=; path=/; max-age=0"}return}
 const r=await fetch("/api/profile/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,invite:c})});const j=await r.json().catch(()=>({}));
 if(!r.ok){$("m").textContent=j.fehler||"Fehler";return}ck(j.name,j.code);
 $("fm").innerHTML='<h1 style="font-size:20px;text-align:center">Profil angelegt</h1><p class="mu" style="text-align:center">Dein persönlicher Code. Bitte merken, damit meldest du dich am Handy und an anderen Geräten an:</p><div class="code">'+esc(j.code)+'</div><button class="btn" id="ok">Weiter</button>';$("ok").onclick=()=>location.reload()};
</script></body></html>
