<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUDPilot Planer</title><link rel="icon" href="/logo.png" type="image/png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#ff7a00;--ok:#1a8f3c;--er:#c62828;--bd:#dde1e6}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mu:#9aa;--bd:#2d3339}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;display:flex}
#side{width:340px;max-width:44vw;overflow:auto;padding:12px;box-sizing:border-box;border-right:1px solid var(--bd)}#mapw{flex:1;position:relative;min-width:0}#map{position:absolute;inset:0}
#big{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:8px 20px;text-align:center;pointer-events:none;white-space:nowrap}
#big b{font-size:30px;line-height:1.15;font-weight:700}#big .u{font-size:16px;color:var(--mu);margin:0 8px 0 3px}#big .s{display:block;font-size:12.5px;color:var(--mu)}
h1{font-size:18px;margin:0 0 8px}h2{font-size:13px;margin:14px 0 6px;color:var(--ac);letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
button{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:7px 11px;font-size:14px;cursor:pointer;margin:2px 2px 2px 0}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5}
input,select{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);max-width:100%;box-sizing:border-box}input[type=text],input[type=password],select{width:100%;margin:3px 0}
.mu{color:var(--mu);font-size:13px}.er{color:var(--er)}.ok{color:var(--ok)}ol{margin:4px 0;padding-left:22px}li{margin:3px 0}li span.x{cursor:pointer;color:var(--er);margin-left:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bd)}.row a{cursor:pointer}
.maplibregl-popup-content{background:var(--card);color:var(--tx);border-radius:10px;padding:12px 10px 8px}.maplibregl-popup-tip{display:none}
.pin{width:26px;height:26px;border-radius:50%;background:#ff7a00;color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);font:700 12px/22px system-ui;text-align:center;cursor:grab}
.pin.s{background:#1a8f3c}.pin.z{background:#c62828}.pop button{display:block;width:100%;margin:3px 0;text-align:left}
#rtDlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
.rt{width:min(400px,94vw);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:18px 22px 20px;box-shadow:0 10px 36px rgba(0,0,0,.35)}
.rt h2{margin:0 0 2px;font-size:18px;color:var(--tx);text-transform:none;letter-spacing:0}.rt .x{float:right;color:var(--mu);font-size:20px;cursor:pointer;line-height:1}
.rt .km{font-size:40px;font-weight:700;text-align:center;margin:6px 0 0}.rt .km span{font-size:18px;color:var(--mu);font-weight:500}.rt .km #rtKmv{font-size:40px;font-weight:700;color:var(--tx)}
.rt input[type=range]{width:100%;accent-color:var(--ac);margin:8px 0 0;padding:0}.rt .sc{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin:0 2px 10px}
.rose{position:relative;width:200px;height:200px;margin:6px auto 8px;border-radius:50%;background:var(--bg);border:1px solid var(--bd)}
.rose .d{position:absolute;width:42px;height:42px;margin:-21px;border-radius:50%;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;user-select:none}
.rose .d.on{background:var(--ac);border-color:var(--ac);color:#fff}.rose .c{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--card);border:2px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}.rose .c.on{border-color:var(--ac)}
.rb{display:flex;gap:8px;margin-top:10px}.rb button{flex:1;padding:11px;font-size:15px;font-weight:600}.rb .g{flex:0 0 auto;padding:11px 16px}
.acc{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}.acc summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none}.acc summary::-webkit-details-marker{display:none}.acc[open] summary{border-bottom:1px solid var(--bd)}.acc .b{padding:4px 12px 12px}
.sub{font-size:12px;color:var(--ac);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px}
.res{padding:6px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.res:hover{background:var(--bg)}.res span{display:block;font-size:12px}.fav.q i{border-color:var(--ac)}
li span.m{cursor:pointer;margin-left:6px;color:var(--mu)}
.fav{display:flex;align-items:center;gap:5px;cursor:pointer;transform:translateY(-2px)}.fav i{font-style:normal;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #7a4cff;box-shadow:0 1px 4px rgba(0,0,0,.45);text-align:center;font:14px/20px system-ui;flex:none}.fav.h i{border-color:#1a8f3c}
.fav b{font:600 12px system-ui;color:#222;background:rgba(255,255,255,.88);border-radius:5px;padding:1px 5px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}.nolab .fav b{display:none}
@media(max-width:700px){body{flex-direction:column}#side{width:auto;max-width:none;height:46%;border-right:0}#mapw{height:54%;flex:none}#big b{font-size:24px}}
</style></head><body><!--AUTH--><!--NAV-->
<div id="side">
<h1>Tourenplaner</h1>
<div class="card">
<div class="row" style="gap:6px"><input type="text" id="q" placeholder="🔍 Adresse oder Ort suchen …" style="flex:1;margin:0"><button id="bQ">Suchen</button></div>
<div id="qres"></div>
<div class="chips"><button class="g" data-poi="fuel">⛽ Tanken</button><button class="g" data-poi="food">🍴 Essen</button><button class="g" data-poi="hotel">🏨 Hotel</button><button class="g" data-poi="parking">🅿 Parken</button></div>
<div id="poires"></div>
<div class="mu" style="margin:8px 0 2px">Klick auf die Karte: Start, Zwischenpunkt oder Ziel setzen. Marker ziehen oder anklicken. Reihenfolge mit ▲ ▼.</div>
<ol id="pts"></ol><div id="info" class="mu">Noch keine Punkte.</div><div id="err" class="er"></div>
<button class="g" id="bRev">⇄ Umkehren</button><button class="g" id="bUndo">Letzten Punkt entfernen</button><button class="g" id="bClear">Alles löschen</button></div>
<div class="card">
<input type="text" id="name" placeholder="Name der Tour">
<button id="bSave">Speichern</button><button class="g" id="bGpx">GPX speichern</button>
<div id="msg" class="mu"></div></div>
<button id="bRt" style="width:100%;padding:10px;font-weight:600;margin:0 0 10px">⟳ Rundtour erstellen …</button><button class="g" id="bRtAgain" style="display:none;width:100%;margin:-4px 0 10px">🎲 Andere Variante</button>
<details class="acc" id="accFav" open><summary>★ Favoriten</summary><div class="b"><label style="display:block;margin-bottom:6px"><input type="checkbox" id="favShow" checked> Auf der Karte zeigen</label><div id="favs"><span class="mu">…</span></div></div></details>
<details class="acc" id="accSet"><summary>⚙ Einstellungen <span class="mu" id="setSum"></span></summary><div class="b">
<div class="sub">Profil</div>
<select id="prof"><option value="motorrad_landstrasse">Landstraße (Motorrad)</option><option value="motorrad_kurvig">Kurvig (Motorrad)</option><option value="motorrad_schnell">Schnell (Motorrad)</option><option value="motorrad_schnellste">Schnellste (mit Autobahn)</option><option value="auto">Auto</option></select>
<div class="sub">Vermeiden</div>
<div id="avoid" style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:4px"><label><input type="checkbox" value="motorway"> Autobahn</label><label><input type="checkbox" value="ferry"> Fähren</label><label><input type="checkbox" value="toll"> Maut</label><label><input type="checkbox" value="unpaved"> Unbefestigt</label></div>
<div class="sub">Sperrungen</div>
<label style="display:block;margin-bottom:4px"><input type="checkbox" id="sperr" checked> Sperrungen umfahren</label>
<label style="display:block"><input type="checkbox" id="bszeig" checked> Baustellen zeigen <span class="mu" id="bsinfo"></span></label>
<div class="sub">Karte</div><select id="sty"></select><div class="mu" id="styhint"></div>
</div></details>

</div><div id="mapw"><div id="map"></div><div id="big"></div></div>
<div id="rtDlg"><div class="rt"><span class="x" id="rtX">✕</span><h2>Rundtour</h2><div class="mu" id="rtStart"></div>
<div class="km"><span id="rtKmv"></span> <span>km</span></div><input type="range" id="rtKm" min="50" max="500" step="10"><div class="sc"><span>50</span><span>500 km</span></div>
<div style="font-weight:600;text-align:center">Richtung <span class="mu" style="font-weight:400" id="rtDirTxt"></span></div>
<div class="rose" id="rtRose"></div><div class="mu" id="rtHint" style="text-align:center"></div>
<label class="mu" style="display:block;text-align:center;margin-top:8px"><input type="checkbox" id="rtLand"> Länderübergreifend erlauben</label>
<div id="rtMsg" class="mu" style="text-align:center;margin-top:8px;min-height:18px"></div>
<div class="rb"><button class="g" id="rtCancel">Abbrechen</button><button id="rtGo">Rundtour erstellen</button></div></div></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id);
const OSM="© OpenStreetMap-Mitwirkende";
const DEM={type:"raster-dem",tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],encoding:"terrarium",tileSize:256,maxzoom:14,attribution:"Höhendaten: Mapzen/AWS Terrain Tiles"};
const ras=(tiles,mz,att)=>({version:8,sources:{r:{type:"raster",tiles,tileSize:256,maxzoom:mz,attribution:att}},layers:[{id:"r",type:"raster",source:"r"}]});
const rasT=(tiles,mz,att,ex)=>({version:8,sources:{r:{type:"raster",tiles,tileSize:256,maxzoom:mz,attribution:att},dem:DEM,dem2:DEM},
 layers:[{id:"r",type:"raster",source:"r"},{id:"hs",type:"hillshade",source:"dem2",paint:{"hillshade-exaggeration":.35,"hillshade-shadow-color":"#3a3a3a"}}],terrain:{source:"dem",exaggeration:ex}});
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
const STYLES={
 "Standard":{s:()=>ras(["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],19,OSM),p:0},
 "Hell (ruhig)":{s:()=>ras([ESRI+"Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"],16,"Tiles © Esri, "+OSM),p:0},
 "Dunkel":{s:()=>ras([ESRI+"Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],16,"Tiles © Esri, "+OSM),p:0},
 "Straßen (Esri)":{s:()=>ras([ESRI+"World_Street_Map/MapServer/tile/{z}/{y}/{x}"],19,"Tiles © Esri"),p:0},
 "Topografie (Höhenlinien)":{s:()=>ras(["https://a.tile.opentopomap.org/{z}/{x}/{y}.png","https://b.tile.opentopomap.org/{z}/{x}/{y}.png"],17,OSM+' © OpenTopoMap'),p:0},
 "Satellit":{s:()=>ras([ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}"],19,"Tiles © Esri"),p:0},
 "3D Gelände (Karte)":{s:()=>rasT(["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],19,OSM,1.5),p:62,hint:"Gelände in 3D. Neigen/Drehen: rechte Maustaste halten und ziehen (oder Strg + ziehen)."},
 "3D Gelände (Satellit)":{s:()=>rasT([ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}"],19,"Tiles © Esri",1.5),p:62,hint:"Satellitenbild auf 3D-Gelände. Neigen/Drehen: rechte Maustaste halten und ziehen."},
 "3D Gebäude (Stadt)":{s:()=>"https://tiles.openfreemap.org/styles/liberty",p:60,hint:"Städte mit 3D-Gebäuden (OpenFreeMap). Nah heranzoomen, rechte Maustaste zum Neigen."}};
let sty="Standard";try{sty=localStorage.getItem("hudstyle")||sty}catch(e){}if(!STYLES[sty])sty="Standard";
Object.keys(STYLES).forEach(k=>{const o=document.createElement("option");o.value=o.textContent=k;$("sty").appendChild(o)});$("sty").value=sty;
const map=new maplibregl.Map({container:"map",style:STYLES[sty].s(),center:[11.0,49.0],zoom:6.5,pitch:STYLES[sty].p,maxPitch:75,attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"top-right");
map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");
let pts=[],markers=[],last=null,tid=null,timer=null,seq=0,routeGeo=null;
try{$("prof").value=localStorage.getItem("hudprof")||"motorrad_landstrasse"}catch(e){}
const avoidBoxes=()=>[...document.querySelectorAll("#avoid input")];
const getAvoid=()=>avoidBoxes().filter(c=>c.checked).map(c=>c.value);
const setAvoid=a=>avoidBoxes().forEach(c=>c.checked=(a||[]).includes(c.value));
try{setAvoid(JSON.parse(localStorage.getItem("hudavoid")||"[]"))}catch(e){}
try{if(localStorage.getItem("hudsperr")==="0")$("sperr").checked=false}catch(e){}
$("sperr").onchange=()=>{try{localStorage.setItem("hudsperr",$("sperr").checked?"1":"0")}catch(e){}route()};
avoidBoxes().forEach(c=>c.onchange=()=>{try{localStorage.setItem("hudavoid",JSON.stringify(getAvoid()))}catch(e){}sumUpdate();route()});
$("styhint").textContent=STYLES[sty].hint||"";
$("sty").onchange=()=>{sty=$("sty").value;try{localStorage.setItem("hudstyle",sty)}catch(e){}
 $("styhint").textContent=STYLES[sty].hint||"";map.setStyle(STYLES[sty].s());map.easeTo({pitch:STYLES[sty].p,duration:800})};
let bsGeo={type:"FeatureCollection",features:[]},bsItems=[];
const BSCOL=["match",["get","k"],"c","#e53935","r","#ff8f00","#ffb300"],BSW=["match",["get","k"],"c",7,"r",5,3.5];
function ensureBs(){try{
 if(!map.getSource("bs"))map.addSource("bs",{type:"geojson",data:bsGeo});
 if(!map.getLayer("bs-line"))map.addLayer({id:"bs-line",type:"line",source:"bs",minzoom:8,layout:{"line-cap":"round","line-join":"round","visibility":$("bszeig").checked?"visible":"none"},paint:{"line-color":BSCOL,"line-width":BSW,"line-opacity":.85}});
}catch(e){}}
async function loadBs(){try{const r=await fetch("/api/baustellen");if(!r.ok)return;const j=await r.json();const t=j.test&&j.ref?j.ref:Math.floor(Date.now()/1000);
 bsItems=[];const fs=[];(j.items||[]).forEach((x,i)=>{if((x.e&&x.e<t)||(x.s&&x.s>t))return;bsItems.push(x);
  fs.push({type:"Feature",properties:{k:x.k,n:bsItems.length-1},geometry:{type:"LineString",coordinates:(x.g&&x.g.length>=2?x.g:[x.a,x.b]).map(q=>[q[1],q[0]])}})});
 bsGeo={type:"FeatureCollection",features:fs};ensureBs();const src=map.getSource("bs");if(src)src.setData(bsGeo);
 $("bsinfo").textContent=fs.length?"("+fs.length+(j.test?", Testdaten":"")+")":"(keine Daten)"}catch(e){}}
const BSN={c:"Gesperrt",r:"Eingeschränkt",w:"Arbeiten"};
function bsPopup(i,ll){const x=bsItems[i];if(!x)return;const d=document.createElement("div");d.style.fontSize="13px";
 const h=document.createElement("b");h.textContent=(BSN[x.k]||"Baustelle")+(x.r?" · "+x.r:"");d.appendChild(h);
 const t=document.createElement("div");t.style.whiteSpace="pre-line";t.style.marginTop="4px";t.textContent=x.t||"";d.appendChild(t);
 if(x.e){const u=document.createElement("div");u.className="mu";u.style.marginTop="4px";u.textContent="Bis "+new Date(x.e*1000).toLocaleDateString("de-DE");d.appendChild(u)}
 popup(ll,d)}
$("bszeig").onchange=()=>{try{localStorage.setItem("hudbs",$("bszeig").checked?"1":"0")}catch(e){}if(map.getLayer("bs-line"))map.setLayoutProperty("bs-line","visibility",$("bszeig").checked?"visible":"none")};
try{if(localStorage.getItem("hudbs")==="0")$("bszeig").checked=false}catch(e){}
map.on("mouseenter","bs-line",()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave","bs-line",()=>map.getCanvas().style.cursor="");
function ensureRoute(){
 ensureBs();
 if(!map.isStyleLoaded&&!map.getStyle())return;
 try{
  if(!map.getSource("route"))map.addSource("route",{type:"geojson",data:routeGeo||{type:"FeatureCollection",features:[]}});
  if(!map.getLayer("route-casing"))map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#ffffff","line-width":9,"line-opacity":.9}});
  if(!map.getLayer("route-line"))map.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#ff7a00","line-width":5.5}});
 }catch(e){}}
map.on("style.load",ensureRoute);map.on("load",loadBs);
function drawRoute(coords){
 routeGeo=coords?{type:"Feature",geometry:{type:"LineString",coordinates:coords.map(q=>[q[0],q[1]])}}:null;
 ensureRoute();const src=map.getSource("route");if(src)src.setData(routeGeo||{type:"FeatureCollection",features:[]})}
const lab=(i,n)=>i==0?"Start":i==n-1?"Ziel":"Via "+i;
function say(t,c){$("msg").className=c||"mu";$("msg").textContent=t}
function popup(lnglat,node){new maplibregl.Popup({closeButton:true,maxWidth:"260px"}).setLngLat(lnglat).setDOMContent(node).addTo(map)}
function closePopups(){document.querySelectorAll(".maplibregl-popup").forEach(p=>p.remove())}
function pinEl(i,n){const d=document.createElement("div");d.className="pin "+(i==0?"s":i==n-1?"z":"");d.textContent=i==0?"S":i==n-1?"Z":i;d.title=lab(i,n);return d}
function markerMenu(i){const d=document.createElement("div");d.className="pop";
 const add=(t,f)=>{const b=document.createElement("button");b.className="g";b.textContent=t;b.onclick=()=>{closePopups();f()};d.appendChild(b)};
 add("Punkt löschen",()=>{pts.splice(i,1);redraw();route()});
 if(i>0)add("Als Start",()=>{const p=pts.splice(i,1)[0];pts.unshift(p);redraw();route()});
 if(i<pts.length-1)add("Als Ziel",()=>{const p=pts.splice(i,1)[0];pts.push(p);redraw();route()});return d}
function redraw(){
 markers.forEach(m=>m.remove());markers=[];
 pts.forEach((p,i)=>{const el=pinEl(i,pts.length);
  const m=new maplibregl.Marker({element:el,draggable:true}).setLngLat([p[1],p[0]]).addTo(map);
  m.on("dragend",async()=>{const ll=m.getLngLat();const q=await snapTo([ll.lat,ll.lng]);if(!q)return redraw();pts[i]=q;redraw();route()});
  el.addEventListener("click",e=>{e.stopPropagation();closePopups();popup(m.getLngLat(),markerMenu(i))});markers.push(m)});
 $("pts").innerHTML="";pts.forEach((p,i)=>{const li=document.createElement("li");li.textContent=lab(i,pts.length)+": "+p[0].toFixed(4)+", "+p[1].toFixed(4);
  const mv=(t,d)=>{const x=document.createElement("span");x.className="m";x.textContent=t;x.onclick=()=>{const j=i+d;if(j<0||j>=pts.length)return;const q=pts.splice(i,1)[0];pts.splice(j,0,q);redraw();route()};li.appendChild(x)};
  mv("▲",-1);mv("▼",1);
  const x=document.createElement("span");x.className="x";x.textContent="✕";x.onclick=()=>{pts.splice(i,1);redraw();route()};li.appendChild(x);$("pts").appendChild(li)});
}
const hav=(a,b)=>{const R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
/* Einfügeposition (Index in pts) für einen neuen Zwischenpunkt: mit Route entlang der Linie, sonst günstigste Einfügung */
function insertIndex(p){
 if(last&&last.length>2&&pts.length>=2){
  const rv=last.map(q=>[q[1],q[0]]);const at=[];let from=0;
  for(const q of pts){let bi=from,bd=1e18;for(let k=from;k<rv.length;k++){const d=hav(q,rv[k]);if(d<bd){bd=d;bi=k}}at.push(bi);from=bi}
  let ci=0,cd=1e18;for(let k=0;k<rv.length;k++){const d=hav(p,rv[k]);if(d<cd){cd=d;ci=k}}
  for(let i=0;i<pts.length-1;i++)if(ci>=at[i]&&ci<=at[i+1])return i+1;
 }
 let bi=1,bc=1e18;for(let i=0;i<pts.length-1;i++){const c=hav(pts[i],p)+hav(p,pts[i+1])-hav(pts[i],pts[i+1]);if(c<bc){bc=c;bi=i+1}}return bi}
/* Neuer oder verschobener Punkt rastet auf die nächste befahrbare Straße ein (der Server fragt BRouter, die Karte hier ist nur ein Bild).

 if(ok&&c){drawRoute(c);last=c;$("info").textContent=rtLen(c).toFixed(1)+" km · Fahrzeit wird berechnet …"}
 doRoute(ok);
 say(ok?(near?"Fahrt genau als Route übernommen ("+pts.length+" Punkte). Profil: "+$("prof").selectedOptions[0].textContent+"."+(nDrop?" "+nDrop+" Stelle(n) ohne befahrbaren Weg wurden übersprungen.":""):"Fahrt als Näherung übernommen ("+pts.length+" Punkte). An einzelnen Stellen kann die Route abweichen."):"Berechnung nicht möglich: "+(failTxt||"unbekannter Fehler")+" Es wurden nur Start und Ziel übernommen.",ok?"ok":"er")}

/* ---------- Rundtour: Hinweg und ANDERER Rückweg (Rückweg wird um den Hinweg herum gerechnet) ---------- */
const RT={km:250,dir:null},RTD=["N","NO","O","SO","S","SW","W","NW"],RTL={N:"Norden",NO:"Nordosten",O:"Osten",SO:"Südosten",S:"Süden",SW:"Südwesten",W:"Westen",NW:"Nordwesten"};
let rtBusy=false,rtCancel=false,rtLast=null;
try{const o=JSON.parse(localStorage.getItem("hudrt")||"{}");if(o.km>=50&&o.km<=500)RT.km=o.km;if(o.dir===null||(o.dir>=0&&o.dir<360))RT.dir=o.dir===undefined?null:o.dir;RT.cross=!!o.cross}catch(e){}
function rtLen(c){let s=0;for(let i=1;i<c.length;i++)s+=hav([c[i-1][1],c[i-1][0]],[c[i][1],c[i][0]]);return s/1000}
/* Anteil der Strecke, der nahe an früher schon befahrener Strecke liegt (mehr als 3 km davor): Hin- und Rückweg auf derselben Straße */
function rtDup(c){const cell=new Map();let d=0,dup=0,n=0;for(let i=0;i<c.length;i++){if(i)d+=hav([c[i-1][1],c[i-1][0]],[c[i][1],c[i][0]]);
 const key=Math.round(c[i][1]*700)+","+Math.round(c[i][0]*1000);const f=cell.get(key);if(f!==undefined&&d-f>3000)dup++;else if(f===undefined)cell.set(key,d);n++}return dup/Math.max(1,n)}
function rtMove(p,m,deg){const rad=Math.PI/180;return[+(p[0]+m*Math.cos(deg*rad)/110540).toFixed(6),+(p[1]+m*Math.sin(deg*rad)/(111320*Math.cos(p[0]*rad))).toFixed(6)]}
function rtBear(a,b){const rad=Math.PI/180,dy=(b[0]-a[0])*110540,dx=(b[1]-a[1])*111320*Math.cos(a[0]*rad);return Math.atan2(dx,dy)/rad}
/* Sperrkreise entlang der Hinfahrt (ohne Bereich um Start und Wendepunkt), damit der Rückweg woanders langführt */
function rtNogos(c,lvl){if(!lvl)return"";const d=[0];let tot=0;for(let i=1;i<c.length;i++){tot+=hav([c[i-1][1],c[i-1][0]],[c[i][1],c[i][0]]);d.push(tot)}
 const skip=Math.min(3000,tot*.1),step=Math.max(lvl.step,tot/70),out=[];let nx=skip;
 for(let i=0;i<c.length;i++)if(d[i]>=nx&&d[i]<=tot-skip){out.push(c[i][0].toFixed(5)+","+c[i][1].toFixed(5)+","+lvl.r);nx=d[i]+step}
 return out.join("|")}
/* n Punkte gleichmäßig auf einer Strecke (ohne Anfang und Ende), als [lat,lon] */
function rtSample(c,n){const d=[0];for(let i=1;i<c.length;i++)d.push(d[i-1]+hav([c[i-1][1],c[i-1][0]],[c[i][1],c[i][0]]));const tot=d[d.length-1],out=[];let j=0;
 for(let q=1;q<=n;q++){const t=tot*q/(n+1);while(j<d.length-1&&d[j]<t)j++;out.push([+c[j][1].toFixed(6),+c[j][0].toFixed(6)])}return out}
/* Route mit Wiederholung: Punkte, die BRouter keiner Straße zuordnen kann ("not mapped"), werden 1-3 km verschoben. fixed[i]=true: Punkt darf nicht verschoben werden */
async function rtRoute(wps,fixed,nogos){
 wps=wps.map(p=>p.slice());let e="";
 for(let t=0;t<9;t++){
  if(rtCancel)return{err:"cancel",fatal:true};
  const c=await routeOf(wps,nogos);if(c)return{c,wps};
  e=routeErr;
  if(/datafile/i.test(e)&&/not found/i.test(e)){const m=e.match(/[EW]\d+_[NS]\d+/i);return{err:"Routendaten fehlen"+(m?" ("+m[0]+")":"")+" – Region auf dem Server bauen.",fatal:true}}
  const m=e.match(/(from|to|via(\d+))-position not mapped/i);
  if(!m)return{err:e||"Berechnung fehlgeschlagen."};
  const i=/^from/i.test(m[1])?0:/^to/i.test(m[1])?wps.length-1:+m[2];
  if(fixed[i])return{err:i===0||i===wps.length-1?"Start oder Ziel liegt nicht an einer befahrbaren Straße.":"Ein gesetzter Punkt liegt nicht an einer befahrbaren Straße.",fatal:true};
  wps[i]=rtMove(wps[i],1000+Math.random()*2000,Math.random()*360)}
 return{err:e||"Berechnung fehlgeschlagen."}}
/* Länder (Rahmen der gebauten Regionen) – für "nicht über die Grenze". Unsicher bei überlappenden Rahmen: dort zählt der Punkt nicht. */
let LANDS=null;
async function rtLandsLoad(){if(LANDS)return;try{const j=await(await fetch("/api/laender")).json();LANDS=j.regionen||[]}catch(e){LANDS=[]}}
function rtLandAt(lat,lon){let l=null;for(const r of LANDS||[]){const b=r.bbox;if(lon>=b[0]&&lon<=b[2]&&lat>=b[1]&&lat<=b[3]){if(l&&l!==r.land)return null;l=r.land}}return l}
function rtCrosses(c){if(!LANDS||!LANDS.length)return false;const cnt={};let d=0,nx=0;
 for(let i=0;i<c.length;i++){if(i)d+=hav([c[i-1][1],c[i-1][0]],[c[i][1],c[i][0]]);if(d>=nx){nx=d+2000;const l=rtLandAt(c[i][1],c[i][0]);if(l)cnt[l]=(cnt[l]||0)+1}}
 const v=Object.values(cnt).sort((a,b)=>b-a);return v.length>1&&v[1]>=3}
/* Ein Versuch. Form A (ohne Ziel): Start -> seitlicher Punkt W -> Wendepunkt T -> seitlicher Punkt V (andere Seite) -> Start, Rückweg mit gesperrter Hinfahrt.
   f = wie weit der Wendepunkt liegt (klein = breite Schleife), k = Gesamtgröße. Form B (eigenes Ziel): Hinweg zum Ziel, Rückweg über seitlichen Punkt V. */
async function rtAttempt(x,k,f,side){
 if(x.run.stop)return{err:"stop",fatal:true};
 let T,outV=[],fixed,h;
 if(x.mode==="A"){const D0=x.km*1000/2.6*f,H0=Math.max(.2*D0,Math.sqrt(Math.max(0,Math.pow(x.km*1000/5.2,2)-D0*D0/4)));
  T=rtMove(x.st,D0*k*(.95+Math.random()*.1),x.dir+(Math.random()-.5)*20);h=Math.min(H0*k,120000);
  const mid=[(x.st[0]+T[0])/2,(x.st[1]+T[1])/2];outV=[rtMove(mid,h,rtBear(x.st,T)-side*90)];fixed=[true,false,false]}
 else{T=x.dest;outV=x.vias;fixed=[true,...outV.map(()=>true),true]}
 const o=await rtRoute([x.st,...outV,T],fixed);if(o.err)return o;
 T=o.wps[o.wps.length-1];outV=o.wps.slice(1,-1);
 const outLen=rtLen(o.c),dST=Math.max(2000,hav(x.st,T));
 if(x.mode==="B"){const R=(x.km*k-outLen)*1000/2.6,base=R>dST/2?Math.sqrt(R*R-dST*dST/4):0;h=Math.max(.25*dST,base)}
 h=Math.min(Math.max(h,.2*dST),150000);
 const mid=[(x.st[0]+T[0])/2,(x.st[1]+T[1])/2],V=rtMove(mid,h,rtBear(x.st,T)+side*90);
 let r=null;
 for(const l of [{r:350,step:1500},{r:200,step:2500},null]){
  if(x.run.stop)return{err:"stop",fatal:true};
  r=await rtRoute([T,V,x.st],[true,false,true],rtNogos(o.c,l));
  if(r.c||r.fatal)break}
 if(!r.c)return r;
 const c=o.c.concat(r.c);
 return{c,len:rtLen(c),dup:rtDup(c),st:x.st,T,outV,back:r.c,backLen:rtLen(r.c)}}
/* Ein Arbeiter: erster Versuch, bei zu falscher Länge ein Korrekturversuch mit gemessenem Verhältnis */
async function rtWorker(x,f,side){
 let cur=null,k=1;
 for(let it=0;it<2;it++){
  const r=await rtAttempt(x,k,f,side);if(r.err)return cur?{ok:cur}:{err:r};
  cur=r;const ratio=r.len/x.km;
  if(x.mode==="A"?Math.abs(ratio-1)<=.1:ratio>=.9)break;
  k*=x.mode==="A"?Math.max(.5,Math.min(2,x.km/r.len)):Math.max(1.1,Math.min(2,x.km/r.len))}
 return{ok:cur}}
function rtCtx(){const n=pts.length;
 if(n>=2&&hav(pts[0],pts[n-1])>1500)return{mode:"B",st:pts[0],dest:pts[n-1],vias:pts.slice(1,n-1),km:RT.km,dir:null};
 return{mode:"A",st:rtStartPoint().p,km:RT.km,dir:RT.dir}}
function rtStartPoint(){if(pts.length)return{p:pts[0],t:"erster Punkt der Route"};const h=FAVS.find(x=>x.id=="home");if(h)return{p:[h.lat,h.lon],t:h.name};const c=map.getCenter();return{p:[c.lat,c.lng],t:"Kartenmitte"}}
function rtShow(){const x=rtCtx();$("rtKmv").textContent=RT.km;$("rtKm").value=RT.km;$("rtLand").checked=!!RT.cross;
 $("rtStart").textContent=x.mode==="B"?"Start: erster Punkt · Ziel: letzter Punkt der Route":"Start: "+rtStartPoint().t;
 $("rtHint").textContent=x.mode==="B"?"Ziel ist gesetzt: Hinweg dorthin, anderer Rückweg. Die Länge gilt als „mindestens“, die Richtung ergibt sich aus dem Ziel.":"🎲 Mitte = Richtung zufällig · Hin- und Rückweg sind verschiedene Straßen · Profil und Vermeiden wie im Planer";
 $("rtRose").style.opacity=x.mode==="B"?".3":"1";$("rtRose").style.pointerEvents=x.mode==="B"?"none":"";
 $("rtDirTxt").textContent=x.mode==="B"?"· aus dem Ziel":RT.dir===null?"· zufällig":"· "+RTL[RTD[Math.round(RT.dir/45)%8]];
 document.querySelectorAll("#rtRose .d").forEach(e=>e.classList.toggle("on",RT.dir!==null&&+e.dataset.a===RT.dir));$("rtRose").querySelector(".c").classList.toggle("on",RT.dir===null)}
{const ro=$("rtRose");RTD.forEach((n,i)=>{const a=i*45*Math.PI/180,e=document.createElement("div");e.className="d";e.dataset.a=i*45;e.textContent=n;e.style.left=(100+78*Math.sin(a))+"px";e.style.top=(100-78*Math.cos(a))+"px";e.onclick=()=>{RT.dir=i*45;rtShow()};ro.appendChild(e)});
 const c=document.createElement("div");c.className="c";c.textContent="🎲";c.onclick=()=>{RT.dir=null;rtShow()};ro.appendChild(c)}
$("rtKm").oninput=()=>{RT.km=+$("rtKm").value;rtShow()};
$("rtLand").onchange=()=>{RT.cross=$("rtLand").checked};
function rtOpen(){if(rtBusy)return;$("rtMsg").textContent="";$("rtMsg").className="mu";rtShow();$("rtDlg").style.display="flex"}
function rtClose(){$("rtDlg").style.display="none"}
$("bRt").onclick=rtOpen;$("rtX").onclick=$("rtCancel").onclick=()=>{if(rtBusy){rtCancel=true;$("rtMsg").textContent="Wird abgebrochen …"}else rtClose()};
$("bRtAgain").onclick=()=>rtRun(true);$("rtGo").onclick=()=>rtRun(false);
const rtSay=(t,c)=>{$("rtMsg").className=c||"mu";$("rtMsg").textContent=t};
async function rtRun(again){
 if(rtBusy)return;try{localStorage.setItem("hudrt",JSON.stringify({km:RT.km,dir:RT.dir,cross:!!RT.cross}))}catch(e){}
 const x=again&&rtLast?{...rtLast}:rtCtx(),km=x.km,run={stop:false};x.run=run;
 rtBusy=true;rtCancel=false;$("rtGo").disabled=true;if(again){$("rtDlg").style.display="flex";$("rtMsg").textContent=""}
 rtSay("Berechne Rundtour …");
 const okLen=l=>x.mode==="A"?Math.abs(l/km-1)<=.15:l/km>=.9;
 let best=null,fb=null,fatal="",lastErr="",nCross=0;
 try{
  await rtLandsLoad();
  const check=!RT.cross&&(x.mode==="A"||(()=>{const a=rtLandAt(x.st[0],x.st[1]);return a&&a===rtLandAt(x.dest[0],x.dest[1])})());
  for(let round=0;round<2&&!run.stop&&!rtCancel&&!fatal;round++){
   let pending=3;
   for(let i=0;i<3;i++){
    const f=.35+.55*((i+Math.random())/3),side=Math.random()>.5?1:-1,xx={...x,dir:x.dir===null?Math.random()*360:x.dir};
    rtWorker(xx,f,side).then(r=>{
     pending--;
     if(r.err){if(r.err.fatal&&r.err.err!=="cancel"&&r.err.err!=="stop")fatal=r.err.err;else if(!r.err.fatal)lastErr=r.err.err;return}
     const cur=r.ok;if(!cur||run.stop)return;
     if(check&&rtCrosses(cur.c)){nCross++;return}
     if(okLen(cur.len)){if(!best||cur.dup<best.dup)best=cur;if(cur.dup<.15)run.stop=true}
     else if(!fb||Math.abs(cur.len/km-1)<Math.abs(fb.len/km-1))fb=cur}).catch(e=>{pending--;lastErr=String(e)});
   }
   await new Promise(res=>{const iv=setInterval(()=>{if(run.stop||rtCancel||pending<=0||fatal){clearInterval(iv);res()}},120)});
   if(best&&!rtCancel)break}
  run.stop=true;
  if(rtCancel){rtSay("Abgebrochen.");return}
  if(fatal&&!best&&!fb){rtSay("Rundtour nicht möglich: "+fatal,"er");return}
  const off=!best;if(off)best=fb;
  if(!best){rtSay(nCross?"Alle Vorschläge führten über eine Landesgrenze. „Länderübergreifend erlauben“ ankreuzen oder anderen Start, andere Richtung bzw. Länge versuchen.":"Rundtour nicht möglich: "+(lastErr||"keine passende Strecke gefunden")+". Anderen Start, andere Richtung oder andere Länge probieren.","er");return}
  const nb=Math.max(1,Math.min(Math.ceil(best.backLen/15)-1,24-best.outV.length));
  pts=[best.st,...best.outV,best.T,...rtSample(best.back,nb),best.st];tid=null;{const y={...x};delete y.run;rtLast=y}
  $("name").value="Rundtour "+Math.round(best.len)+" km";redraw();
  const b=new maplibregl.LngLatBounds();pts.forEach(p=>b.extend([p[1],p[0]]));map.fitBounds(b,{padding:60,maxZoom:12});
  drawRoute(best.c);last=best.c;$("err").textContent="";$("info").textContent=best.len.toFixed(1)+" km · Fahrzeit wird berechnet …";bigInfo(best.len,Math.round(best.len/50*60),null);
  doRoute(true);$("bRtAgain").style.display="block";rtClose();
  say("Rundtour: etwa "+Math.round(best.len)+" km"+(off?" (gewünscht "+(x.mode==="B"?"mindestens ":"")+Math.round(km)+" km, mit den Straßen hier nicht genauer möglich)":"")+(best.dup>=.15?". Ein Stück führt zwangsläufig auf derselben Straße, mit „Andere Variante“ gibt es eine neue.":". Hin- und Rückweg sind verschiedene Strecken."),"ok")
 }finally{run.stop=true;rtBusy=false;$("rtGo").disabled=false;$("rtCancel").textContent="Abbrechen"}}
{const u=new URLSearchParams(location.search),q=u.get("tour"),rd=u.get("ride");if(q)map.on("load",()=>openTour(q));else if(rd)map.on("load",()=>openRide(rd))}
</script></body></html>
